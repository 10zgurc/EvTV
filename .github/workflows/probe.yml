name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          v=$(curl -s https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tr '\n' ' ')
          echo "::warning::ffmpeg=$v"
          m=$(curl -s https://dl.google.com/android/maven2/androidx/media3/media3-exoplayer/maven-metadata.xml | grep -o 'versions>.*' | head -c 1500)
          echo "::warning::media3=$m"
