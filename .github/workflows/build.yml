name: APK oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "OzzyTV-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk OzzyTV.apk
          # Eski sabit link de çalışmaya devam etsin
          cp app/build/outputs/apk/release/app-release.apk EvTV.apk

      - name: Hataları özetle
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|Could not (find|resolve)|error:" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Derleme hatası::$msg"

      - name: APK'yı indirilebilir dosya olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: OzzyTV-${{ env.VERSION }}
          path: OzzyTV-${{ env.VERSION }}.apk

      - name: "Yayınla: sabit link (latest) + sürüm numaralı"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sabit link her zaman en yeni sürüm: .../releases/download/latest/EvTV.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest OzzyTV.apk "OzzyTV-$VERSION.apk" EvTV.apk -t "OzzyTV $VERSION (en yeni)" -n "Sürüm $VERSION • derleme ${GITHUB_SHA::7}"
          # Her sürüm ayrıca kalıcı olarak saklanır (gerekirse eskiye dönmek için)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "OzzyTV-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "OzzyTV-$VERSION.apk" -t "OzzyTV $VERSION" -n "Derleme ${GITHUB_SHA::7}" --latest=false
          fi
